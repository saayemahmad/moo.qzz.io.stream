  <style>
    @font-face {
      font-family: 'Noto Sans Bengali';
      src: url('/NotoSansBengali-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #050608;
      --panel: #0a0c0f;
      --panel-alt: #0e1114;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.22);
      --text: #eef2f4;
      --text-dim: #8892a0;
      --text-dimmer: #4d545e;
      --cyan: #55d9c6;
      --cyan-soft: rgba(85, 217, 198, 0.16);
      --red: #e2543f;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
      --display: 'Space Grotesk', sans-serif;
      --bl: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- Ambient background layers ---------- */
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 46px 46px; opacity: 0.35;
      mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 78%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 0%, transparent 78%);
    }

    .viewport-hud {
      position: fixed; inset: 14px; pointer-events: none; z-index: 40;
      background:
        linear-gradient(var(--line-strong), var(--line-strong)) top left / 22px 1px no-repeat,
        linear-gradient(var(--line-strong), var(--line-strong)) top left / 1px 22px no-repeat,
        linear-gradient(var(--line-strong), var(--line-strong)) top right / 22px 1px no-repeat,
        linear-gradient(var(--line-strong), var(--line-strong)) top right / 1px 22px no-repeat,
        linear-gradient(var(--line-strong), var(--line-strong)) bottom left / 22px 1px no-repeat,
        linear-gradient(var(--line-strong), var(--line-strong)) bottom left / 1px 22px no-repeat,
        linear-gradient(var(--line-strong), var(--line-strong)) bottom right / 22px 1px no-repeat,
        linear-gradient(var(--line-strong), var(--line-strong)) bottom right / 1px 22px no-repeat;
    }

    .corner-frame {
      position: relative;
      background-image:
        linear-gradient(var(--line-strong), var(--line-strong)),
        linear-gradient(var(--line-strong), var(--line-strong)),
        linear-gradient(var(--line-strong), var(--line-strong)),
        linear-gradient(var(--line-strong), var(--line-strong)),
        linear-gradient(var(--line-strong), var(--line-strong)),
        linear-gradient(var(--line-strong), var(--line-strong)),
        linear-gradient(var(--line-strong), var(--line-strong)),
        linear-gradient(var(--line-strong), var(--line-strong));
      background-repeat: no-repeat;
      background-size:
        var(--bl) 1px, 1px var(--bl),
        var(--bl) 1px, 1px var(--bl),
        var(--bl) 1px, 1px var(--bl),
        var(--bl) 1px, 1px var(--bl);
      background-position:
        top left, top left,
        top right, top right,
        bottom left, bottom left,
        bottom right, bottom right;
      transition: background-image .2s;
    }

    .corner-frame.accent {
      background-image:
        linear-gradient(var(--cyan), var(--cyan)),
        linear-gradient(var(--cyan), var(--cyan)),
        linear-gradient(var(--cyan), var(--cyan)),
        linear-gradient(var(--cyan), var(--cyan)),
        linear-gradient(var(--cyan), var(--cyan)),
        linear-gradient(var(--cyan), var(--cyan)),
        linear-gradient(var(--cyan), var(--cyan)),
        linear-gradient(var(--cyan), var(--cyan));
    }

    .login-box {
      position: relative;
      z-index: 10;
      background: var(--panel);
      padding: 40px;
      width: 400px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 4px;
      padding-bottom: 10px;
    }

    .brand-mark i {
      width: 5px;
      background: var(--cyan);
      display: block;
      animation: eq 1.4s ease-in-out infinite;
    }

    .brand-mark i:nth-child(1) { height: 10px; animation-delay: -1.1s; }
    .brand-mark i:nth-child(2) { height: 20px; animation-delay: -0.6s; }
    .brand-mark i:nth-child(3) { height: 14px; animation-delay: -0.2s; }
    .brand-mark i:nth-child(4) { height: 24px; animation-delay: -0.9s; }

    @keyframes eq {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .brand-text h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.2px;
    }

    .brand-text span {
      display: block;
      font-size: 12px;
      color: var(--text-dimmer);
      letter-spacing: 2px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-group label {
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .form-group input {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--line-strong);
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .form-group input:focus {
      border-color: var(--cyan);
      background: rgba(85, 217, 198, 0.05);
    }

    .submit-btn {
      background: var(--cyan-soft);
      color: var(--cyan);
      border: 1px solid var(--cyan);
      padding: 14px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background: var(--cyan);
      color: var(--bg);
    }
    
    #errorMsg {
      color: var(--red);
      font-size: 12px;
      text-align: center;
      min-height: 16px;
    }

    .welcome-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

@media (max-width: 600px) {
  .welcome-overlay {
    justify-content: flex-start;
    padding-top: 25vh;
  }
  .cndy-demo {
    transform: scale(0.85);
    margin-top: auto;
    margin-bottom: 50px;
  }
}
.cndy-demo {
  width: min(92vw, 620px);
  text-align: center;
  perspective: 900px;
  margin-top: 30px;
  margin-bottom: 20px;
}
.cndy-bar-wrap {
  position: relative;
  width: 100%;
  height: 76px;
  transform: rotateX(8deg);
  transform-style: preserve-3d;
}
.cndy-track {
  position: absolute;
  inset: 14px 0 0;
  height: 52px;
  border-radius: 30px;
  background: #f5b9d3;
  box-shadow:
    inset 0 7px 9px rgba(117,39,84,.16),
    inset 0 -5px 0 rgba(255,255,255,.3),
    0 10px 0 #d98aac,
    0 16px 22px rgba(117,39,84,.14);
}
.cndy-fill {
  position: absolute;
  left: 8px;
  top: 22px;
  width: 0%;
  height: 36px;
  border-radius: 22px;
  transform: translateZ(18px);
  background: #ff5b9f;
  box-shadow:
    inset 0 7px 0 rgba(255,255,255,.35),
    inset 0 -7px 0 rgba(190,40,105,.18),
    0 5px 0 #d83d7c,
    0 9px 12px rgba(190,48,111,.22);
  transition: width .08s linear;
}
.cndy-fill:before {
  content: "";
  position: absolute;
  left: 13px;
  right: 13px;
  top: 6px;
  height: 8px;
  border-radius: 20px;
  background: rgba(255,255,255,.38);
}
.cndy-fill:after {
  content: "";
  position: absolute;
  right: 10px;
  top: 7px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  opacity: .75;
  box-shadow: 0 0 0 5px rgba(255,255,255,.12);
}
.cndy-candy {
  position: absolute;
  z-index: 5;
  left: 0;
  top: -7px;
  width: 58px; height: 58px;
  border-radius: 20px;
  transform: translateX(0) translateZ(45px) rotate(-8deg);
  background: #ff70ad;
  box-shadow:
    inset 7px 7px 0 rgba(255,255,255,.42),
    inset -7px -9px 0 rgba(130,30,78,.15),
    0 7px 0 #d83d7c,
    0 13px 18px rgba(117,39,84,.2);
  transition: left .08s linear;
}
.cndy-candy:before {
  content: "";
  position: absolute;
  width: 22px; height: 9px;
  left: 11px; top: 9px;
  border-radius: 50%;
  background: rgba(255,255,255,.72);
  transform: rotate(-25deg);
}
.cndy-candy:after {
  content: "";
  position: absolute;
  width: 7px; height: 7px;
  right: 10px; bottom: 10px;
  border-radius: 50%;
  background: rgba(255,255,255,.3);
}
.cndy-face {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
}
.cndy-eye {
  position: absolute;
  top: 22px;
  width: 7px; height: 11px;
  border-radius: 50%;
  background: #602346;
}
.cndy-eye.l { left: 17px }
.cndy-eye.r { right: 17px }
.cndy-mouth {
  position: absolute;
  width: 17px; height: 9px;
  left: 20px; top: 33px;
  border-bottom: 3px solid #602346;
  border-radius: 0 0 50% 50%;
}
.cndy-cheek {
  position: absolute;
  width: 10px; height: 6px;
  top: 34px; border-radius: 50%;
  background: #ff9ac1;
}
.cndy-cheek.l { left: 7px }
.cndy-cheek.r { right: 7px }

.cndy-bubbles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.cndy-bubble {
  position: absolute;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: #fff;
  opacity: 0;
  animation: float 1.2s ease-out infinite;
}
.cndy-bubble.b1 { left: 25%; top: 0 }
.cndy-bubble.b2 { left: 52%; top: 8px; animation-delay: .35s }
.cndy-bubble.b3 { left: 73%; top: 0; animation-delay: .7s }

.cndy-info {
  margin-top: 25px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.cndy-percent {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1px;
}
.cndy-status {
  margin-top: 4px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
  opacity: .9;
}
@keyframes float {
  0% { transform: translateY(10px) scale(.5); opacity: 0 }
  25% { opacity: .9 }
  100% { transform: translateY(-30px) scale(1.15); opacity: 0 }
}
@keyframes wiggle {
  0%, 100% { transform: translateZ(45px) rotate(-8deg) scale(1) }
  50% { transform: translateZ(55px) rotate(5deg) scale(1.06) }
}
.cndy-candy.wiggle { animation: wiggle .7s ease-in-out infinite }


@media (max-width: 600px) {
  .welcome-overlay {
    justify-content: flex-start !important;
    padding-top: 15vh !important;
  }
  .cndy-demo {
    transform: scale(0.85) !important;
    margin-top: auto !important;
    margin-bottom: 20px !important;
  }
}
</style>

    <div class="cndy-demo" id="candyLoader" style="display: none;">
      <div class="cndy-bar-wrap">
        <div class="cndy-track"></div>
        <div class="cndy-fill"></div>
        <div class="cndy-candy">
          <div class="cndy-face">
            <i class="cndy-eye l"></i>
            <i class="cndy-eye r"></i>
            <i class="cndy-cheek l"></i>
            <i class="cndy-cheek r"></i>
            <i class="cndy-mouth"></i>
          </div>
        </div>
        <div class="cndy-bubbles">
          <i class="cndy-bubble b1"></i>
          <i class="cndy-bubble b2"></i>
          <i class="cndy-bubble b3"></i>
        </div>
      </div>
      <div class="cndy-info">
        <div class="cndy-percent">0%</div>
        <div class="cndy-status">LOADING...</div>
      </div>
    </div>

  </div>

  <form id="loginForm" class="login-box corner-frame accent">
    <div class="brand">
      <div class="brand-mark"><i></i><i></i><i></i><i></i></div>
      <div class="brand-text">
        <h1>Signal Deck</h1>
        <span>Authorization Required</span>
      </div>
    </div>

    <div class="form-group">
      <label for="password">Access Code</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" autofocus />
    </div>

    <div id="errorMsg"></div>

    <button type="submit" class="submit-btn">Initialize Link</button>
  </form>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const err = document.getElementById('errorMsg');
      
      err.textContent = '';
      try {
        const res = await fetch('https://api.moo.qzz.io/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ password: password }),
          credentials: 'include'
        });
        
        if (res.ok) {
          const overlay = document.getElementById('welcomeOverlay');
          overlay.classList.add('active');
            startCandyLoader(5000);
          setTimeout(() => {
            window.location.href = 'https://moo.qzz.io/analytics';
          }, 5000);
        } else {
          err.textContent = 'ACCESS DENIED';
        }
      } catch (error) {
        err.textContent = 'CONNECTION FAILED';
      }
    });

      window.startCandyLoader = function(duration) {
        const loader = document.getElementById("candyLoader");
        if (!loader) return;
        loader.style.display = "block";
        const fill = document.querySelector(".cndy-fill");
        const candy = document.querySelector(".cndy-candy");
        const percent = document.querySelector(".cndy-percent");
        const status = document.querySelector(".cndy-status");
        
        let startTime = Date.now();
        candy.classList.add("wiggle");
        
        function animate() {
          let elapsed = Date.now() - startTime;
          let p = Math.min((elapsed / duration) * 100, 100);
          
          const wrap = document.querySelector(".cndy-bar-wrap");
          if (!wrap) return;
          const trackWidth = wrap.clientWidth;
          const candySize = candy.offsetWidth;
          const fillStart = 8;
          const fillEnd = fillStart + ((trackWidth - fillStart * 2) * p / 100);
          const candyX = Math.max(0, Math.min(trackWidth - candySize, fillEnd - candySize / 2));
          
          fill.style.width = Math.max(0, fillEnd - fillStart) + "px";
          candy.style.left = candyX + "px";
          percent.textContent = Math.floor(p) + "%";
          
          if (p < 100) {
            requestAnimationFrame(animate);
          } else {
            status.textContent = "READY!";
            candy.classList.remove("wiggle");
          }
        }
        animate();
      }
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <title>Deleted Messages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: monospace; 
      background: #000; 
      color: #eee; 
      padding: 20px; 
      margin: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 { 
      color: #ef4444; 
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }
    #msgs { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      margin-top: 20px;
    }
    .msg { 
      background: #111; 
      padding: 12px; 
      border-left: 3px solid #ef4444; 
    }
    .meta { 
      font-size: 11px; 
      color: #888; 
      margin-bottom: 6px; 
      display: flex;
      justify-content: space-between;
    }
    .sender { 
      font-weight: bold; 
      color: #06b6d4; 
      font-size: 13px;
    }
    .text { 
      white-space: pre-wrap; 
      word-break: break-word; 
      color: #ccc;
      line-height: 1.4;
    }
    #status {
      color: #888;
      font-style: italic;
    }
    .error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deleted Messages Log</h1>
    <div id="status">Connecting to database...</div>
    <div id="msgs"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js';
    import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js';

    // Same config as analytics.html
    const firebaseConfig = {
      apiKey: "AIzaSyCW3FDXQBLWJLT5_NVesq1YSLWuLAo0DkY",
      authDomain: "dev-ca098.firebaseapp.com",
      databaseURL: "https://dev-ca098-default-rtdb.firebaseio.com",
      projectId: "dev-ca098",
      storageBucket: "dev-ca098.firebasestorage.app",
      messagingSenderId: "114541724377",
      appId: "1:114541724377:web:50d843a5606e37b86334c8"
    };

    const app = initializeApp(firebaseConfig, 'deleted-msgs-viewer');
    const db = getDatabase(app);
    const chatRef = ref(db, 'Media_Chat_Web');

    const statusEl = document.getElementById('status');
    const container = document.getElementById('msgs');

    statusEl.innerText = "Fetching all messages (this might take a moment)...";

    onValue(chatRef, (snapshot) => {
      statusEl.style.display = 'none';
      const deletedMsgs = [];
      
      snapshot.forEach(child => {
        const v = child.val();
        if (v.isDeleted) {
          deletedMsgs.push({ id: child.key, ...v });
        }
      });

      // Sort by newest first
      deletedMsgs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

      if (deletedMsgs.length === 0) {
        container.innerHTML = '<div style="color: #888;">No deleted messages found.</div>';
        return;
      }

      container.innerHTML = deletedMsgs.map(msg => {
        const ts = msg.timestamp ? new Date(msg.timestamp).toLocaleString() : 'Unknown time';
        return `
          <div class="msg">
            <div class="meta">
              <span class="sender">${escapeHtml(msg.sender || 'Unknown')}</span>
              <span>${ts}</span>
            </div>
            <div class="text">${escapeHtml(msg.text || '')}</div>
          </div>
        `;
      }).join('');
    }, (error) => {
      statusEl.innerText = 'Error loading messages: ' + error.message;
      statusEl.className = 'error';
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
